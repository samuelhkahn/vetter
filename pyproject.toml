[project]
name = "vetter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samuel Kahn", email = "samuelkahn@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
vetter = "vetter:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
